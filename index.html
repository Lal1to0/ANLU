<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo ANLU Perfumes</title>
  
  <link rel="icon" type="image/png" href="favicon.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Lector de Google Sheets (PapaParse) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  
  <style>
    .accord-bar {
      height: 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      padding-left: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
      margin-bottom: 6px;
      transition: transform 0.15s ease;
    }
    .accord-bar:hover {
      transform: scaleX(1.02);
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-16">

  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
      
      <!-- Logo -->
      <div class="flex items-center justify-between w-full md:w-auto">
        <img src="1234.png" alt="ANLU Parfums" class="h-14 md:h-32 object-contain">
      </div>

      <!-- Buscador -->
      <div class="w-full md:w-80 relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-sm"></i>
        <input type="text" id="searchInput" placeholder="Buscar por nombre o marca..." 
               class="w-full pl-9 pr-4 py-2 border rounded-full text-sm bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-gray-900 transition">
      </div>

    </div>

    <!-- Filtros de categoría -->
    <div class="border-t border-gray-100 bg-white">
      <div class="max-w-6xl mx-auto px-4 flex gap-2 overflow-x-auto py-2.5 scrollbar-none">
        <button onclick="filterCategory('todos')" class="filter-btn active px-4 py-1.5 rounded-full text-sm font-semibold transition bg-gray-900 text-white">Todos</button>
        <button onclick="filterCategory('hombre')" class="filter-btn px-4 py-1.5 rounded-full text-sm font-semibold transition bg-gray-100 text-gray-600 hover:bg-gray-200">Hombre</button>
        <button onclick="filterCategory('mujer')" class="filter-btn px-4 py-1.5 rounded-full text-sm font-semibold transition bg-gray-100 text-gray-600 hover:bg-gray-200">Mujer</button>
        <button onclick="filterCategory('unisex')" class="filter-btn px-4 py-1.5 rounded-full text-sm font-semibold transition bg-gray-100 text-gray-600 hover:bg-gray-200">Unisex</button>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="max-w-6xl mx-auto px-4 py-8 relative">
    
    <!-- Animación de Cargando... -->
    <div id="loading" class="text-center py-16">
      <i class="fa-solid fa-spinner fa-spin text-4xl text-gray-400 mb-4"></i>
      <p class="text-gray-500 font-medium text-lg">Cargando inventario...</p>
    </div>

    <div id="perfumesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden"></div>
    
    <div id="noResults" class="hidden text-center py-16">
      <p class="text-gray-500 font-medium text-lg">No encontramos perfumes que coincidan con tu búsqueda.</p>
    </div>
  </main>

<!-- Botones Flotantes de Redes Sociales (Instagram + WhatsApp) -->
  <div class="fixed bottom-5 right-5 z-40 flex flex-col items-center gap-3">
    
    <!-- Botón Flotante Redondo de Instagram -->
    <a href="https://instagram.com/anluu.lg" target="_blank" 
       class="w-14 h-14 rounded-full bg-gradient-to-tr from-yellow-500 via-pink-500 to-purple-600 text-white shadow-lg hover:shadow-xl hover:scale-105 transition-all flex items-center justify-center text-2xl group relative"
       title="Síguenos en Instagram">
      <i class="fa-brands fa-instagram"></i>
      <!-- Tooltip para PC -->
      <span class="absolute right-16 bg-gray-900 text-white text-xs px-2.5 py-1 rounded-md opacity-0 group-hover:opacity-100 transition whitespace-nowrap hidden md:block pointer-events-none">
        @anluu.lg
      </span>
    </a>

    <!-- Contenedor relativo para el menú desplegable y botón de WhatsApp -->
    <div class="relative flex flex-col items-center">
      <!-- Menú Desplegable de WhatsApp -->
      <div id="waPopup" class="hidden absolute bottom-16 right-0 bg-white shadow-2xl rounded-2xl p-4 border border-gray-100 w-64 animate-fade-in transition-all z-50">
        <p class="text-xs font-black uppercase tracking-wider text-gray-400 mb-2">Escríbenos por WhatsApp</p>
        <div class="space-y-2">
          <a href="https://wa.me/584243306803?text=Hola%20ANLU%20Perfumes%2C%20quisiera%20hacer%20una%20consulta" target="_blank" class="flex items-center gap-3 p-2 rounded-xl hover:bg-green-50 transition border border-transparent hover:border-green-200">
            <div class="w-8 h-8 rounded-full bg-[#25D366] text-white flex items-center justify-center text-sm shadow-sm flex-shrink-0">
              <i class="fa-brands fa-whatsapp"></i>
            </div>
            <div>
              <span class="block text-xs font-bold text-gray-800">Atención 1</span>
              <span class="block text-[11px] text-gray-500 font-medium">+58 424-3306803</span>
            </div>
          </a>

          <a href="https://wa.me/584124596671?text=Hola%20ANLU%20Perfumes%2C%20quisiera%20hacer%20una%20consulta" target="_blank" class="flex items-center gap-3 p-2 rounded-xl hover:bg-green-50 transition border border-transparent hover:border-green-200">
            <div class="w-8 h-8 rounded-full bg-[#25D366] text-white flex items-center justify-center text-sm shadow-sm flex-shrink-0">
              <i class="fa-brands fa-whatsapp"></i>
            </div>
            <div>
              <span class="block text-xs font-bold text-gray-800">Atención 2</span>
              <span class="block text-[11px] text-gray-500 font-medium">+58 412-4596671</span>
            </div>
          </a>
        </div>
      </div>

      <!-- Botón Flotante Redondo de WhatsApp -->
      <button onclick="toggleWaPopup()" class="bg-[#25D366] text-white w-14 h-14 rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition flex items-center justify-center text-2xl focus:outline-none">
        <i class="fa-brands fa-whatsapp"></i>
      </button>
    </div>
  </div>
  

  <script>
    const SHEET_ID = "1kCqVj7HIP7oouLyOmwptYOmbXEuzQARgxvmit7EdsXw";
    const GID = "1819198756";
    const SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}&t=${Date.now()}`;

    const PRIMARY_WA = "584243306803";
    const SECONDARY_WA = "584124596671";
    
    let perfumes = [];
    let currentCategory = "todos";

    const grid = document.getElementById("perfumesGrid");
    const noResults = document.getElementById("noResults");
    const modal = document.getElementById("perfumeModal");
    const modalContent = document.getElementById("modalContent");
    const searchInput = document.getElementById("searchInput");
    const loading = document.getElementById("loading");

    function toggleWaPopup() {
      const popup = document.getElementById("waPopup");
      popup.classList.toggle("hidden");
    }

    function getAccordColor(name) {
      if (!name) return "#5D6D7E";
      const n = name.toLowerCase();
      if(n.includes("cítrico") || n.includes("limón")) return "#F1C40F";
      if(n.includes("amaderado") || n.includes("madera") || n.includes("cuero")) return "#795548";
      if(n.includes("dulce") || n.includes("avainillado") || n.includes("gourmand") || n.includes("caramelo")) return "#D35400";
      if(n.includes("acuático") || n.includes("fresco")) return "#3498DB";
      if(n.includes("frutado") || n.includes("tropical") || n.includes("frutal")) return "#E67E22";
      if(n.includes("floral") || n.includes("blanco") || n.includes("rosa")) return "#E91E63";
      if(n.includes("especiado") || n.includes("ambarado") || n.includes("ámbar")) return "#A04000";
      if(n.includes("verde") || n.includes("aromático") || n.includes("musgo")) return "#2ECC71";
      if(n.includes("almizclado") || n.includes("atalcado") || n.includes("lactónico")) return "#BDC3C7";
      return "#5D6D7E"; 
    }

    Papa.parse(SHEET_CSV_URL, {
      download: true,
      header: true,
      complete: function(results) {
        const data = results.data;
        
        perfumes = data.filter(row => row.Nombre && row.Nombre.trim() !== "").map((row, index) => {
          let cleanPrice = (row.Precio || "").toString().replace(/[^0-9.,]/g, "").replace(",", ".");
          let priceVal = parseFloat(cleanPrice);
          let priceStr = isNaN(priceVal) || priceVal === 0 ? "$0" : "$" + priceVal.toFixed(2);

          let accords = [];
          const widths = ["100%", "85%", "70%", "55%", "40%"];
          for(let i=1; i<=5; i++) {
            let aName = row[`Acorde_${i}`];
            if(aName && aName.trim() !== "") {
              accords.push({ name: aName.trim(), width: widths[i-1], color: getAccordColor(aName) });
            }
          }

          return {
            id: index + 1,
            name: row.Nombre.trim(),
            brand: (row.Marca || "").trim(),
            gender: (row.Género || "unisex").trim().toLowerCase(),
            price: priceStr,
            image: (row.Imagen_URL || "").trim(),
            concentration: (row.Concentración || "").trim(),
            accords: accords,
            topNotes: row.Notas_Salida ? row.Notas_Salida.split(',').map(s=>s.trim()) : [],
            heartNotes: row.Notas_Corazón ? row.Notas_Corazón.split(',').map(s=>s.trim()) : [],
            baseNotes: row.Notas_Fondo ? row.Notas_Fondo.split(',').map(s=>s.trim()) : []
          };
        });
        
        loading.classList.add("hidden");
        grid.classList.remove("hidden");
        applyFilters(); 
      },
      error: function(err) {
        loading.innerHTML = '<p class="text-red-500 font-bold mt-4">Error al conectar con la base de datos de Google Sheets.</p>';
      }
    });

    function renderCards(data) {
      if (data.length === 0) {
        grid.innerHTML = "";
        noResults.classList.remove("hidden");
        return;
      }
      noResults.classList.add("hidden");

      grid.innerHTML = data.map(p => {
        const isPreorder = p.price === "$0" || p.price === "$0.00";
        const displayPrice = isPreorder ? "ENCARGAR" : p.price;
        const priceClass = isPreorder ? "text-blue-600 text-sm tracking-widest" : "text-gray-900 text-lg";

        const badgeHTML = isPreorder 
          ? '<span class="absolute top-3 right-3 bg-blue-100 text-blue-700 text-[10px] font-black px-2 py-1 rounded-md uppercase tracking-wide shadow-sm">Bajo Pedido</span>'
          : '<span class="absolute top-3 right-3 bg-green-100 text-green-700 text-[10px] font-black px-2 py-1 rounded-md uppercase tracking-wide shadow-sm">Disponible</span>';

        return `
        <div onclick="openModal(${p.id})" class="bg-white rounded-xl shadow-sm hover:shadow-xl transition duration-200 cursor-pointer overflow-hidden border border-gray-200 flex flex-col justify-between group">
          <div class="h-64 flex items-center justify-center p-4 bg-gray-50/70 group-hover:bg-white transition relative">
            ${badgeHTML}
            <img src="${p.image}" alt="${p.name}" class="h-full object-contain group-hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/300x400?text=ANLU'">
          </div>
          <div class="p-4 flex flex-col justify-between flex-1">
            <div>
              <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">${p.brand}</span>
                <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded-full ${
                  p.gender === 'hombre' ? 'bg-blue-50 text-blue-600 border border-blue-200' :
                  p.gender === 'mujer' ? 'bg-pink-50 text-pink-600 border border-pink-200' :
                  'bg-purple-50 text-purple-600 border border-purple-200'
                }">${p.gender}</span>
              </div>
              <h3 class="font-bold text-gray-900 text-base mt-1 leading-snug">${p.name}</h3>
            </div>
            <div class="mt-4 flex justify-between items-center pt-3 border-t border-gray-100">
              <span class="font-black ${priceClass}">${displayPrice}</span>
              <button class="text-xs bg-gray-900 text-white px-3 py-1.5 rounded-md font-medium hover:bg-black transition">Ver Notas</button>
            </div>
          </div>
        </div>
      `}).join("");
    }

    function openModal(id) {
      const p = perfumes.find(item => item.id === id);
      if (!p) return;

      const isPreorder = p.price === "$0" || p.price === "$0.00";
      const displayPrice = isPreorder ? "ENCARGAR" : p.price;
      const priceLabel = isPreorder ? "Disponibilidad" : "Precio";
      
      const badgeHTML = isPreorder 
        ? '<span class="absolute top-2 left-2 bg-blue-100 text-blue-700 text-[10px] font-black px-2 py-1 rounded-md uppercase tracking-wide shadow-sm">Bajo Pedido</span>'
        : '<span class="absolute top-2 left-2 bg-green-100 text-green-700 text-[10px] font-black px-2 py-1 rounded-md uppercase tracking-wide shadow-sm">Disponible</span>';

      const whatsappText = isPreorder 
        ? encodeURIComponent(`Hola ANLU Perfumes, me interesa encargar el perfume bajo pedido: *${p.name}* (${p.brand})`)
        : encodeURIComponent(`Hola ANLU Perfumes, me interesa comprar el perfume: *${p.name}* (${p.brand}) - ${p.price}`);

      modalContent.innerHTML = `
        <div class="flex flex-col md:flex-row gap-6 items-center md:items-start mb-6">
          <div class="w-48 h-48 flex items-center justify-center bg-gray-50 rounded-xl border p-2 flex-shrink-0 relative">
            ${badgeHTML}
            <img src="${p.image}" class="max-h-full max-w-full object-contain" onerror="this.src='https://via.placeholder.com/300x400?text=ANLU'">
          </div>
          <div class="flex-1 w-full">
            <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">${p.brand}</span>
            <h2 class="text-2xl font-black text-gray-900 leading-tight">${p.name}</h2>
            <p class="text-xs text-gray-500 mt-1 mb-4">${p.concentration} • <span class="capitalize font-semibold">${p.gender}</span></p>
            
            <h4 class="text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">Acordes Principales</h4>
            ${p.accords.map(a => `
              <div class="accord-bar" style="width: ${a.width}; background-color: ${a.color};">${a.name}</div>
            `).join("")}
          </div>
        </div>

        <div class="border-t border-gray-100 pt-5">
          <h4 class="text-center font-bold text-gray-800 text-xs uppercase tracking-widest mb-4">Pirámide Olfativa</h4>
          
          <div class="space-y-3">
            <div class="bg-gray-50 p-3 rounded-lg border-l-4 border-blue-500">
              <span class="text-xs font-bold text-gray-500 uppercase">Notas de Salida:</span>
              <p class="text-sm font-medium text-gray-800 mt-0.5">${p.topNotes.join(" • ")}</p>
            </div>
            <div class="bg-gray-50 p-3 rounded-lg border-l-4 border-pink-500">
              <span class="text-xs font-bold text-gray-500 uppercase">Notas de Corazón:</span>
              <p class="text-sm font-medium text-gray-800 mt-0.5">${p.heartNotes.join(" • ")}</p>
            </div>
            <div class="bg-gray-50 p-3 rounded-lg border-l-4 border-amber-600">
              <span class="text-xs font-bold text-gray-500 uppercase">Notas de Fondo:</span>
              <p class="text-sm font-medium text-gray-800 mt-0.5">${p.baseNotes.join(" • ")}</p>
            </div>
          </div>
        </div>

        <div class="mt-6 flex flex-col sm:flex-row justify-between items-center gap-4 ${isPreorder ? 'bg-blue-50 border-blue-200' : 'bg-gray-50 border-gray-200'} p-4 rounded-xl border">
          <div>
            <span class="text-xs ${isPreorder ? 'text-blue-600' : 'text-gray-500'} uppercase font-semibold">${priceLabel}</span>
            <div class="text-2xl font-black ${isPreorder ? 'text-blue-700' : 'text-gray-900'}">${displayPrice}</div>
          </div>
          
          <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
            <a href="https://wa.me/${PRIMARY_WA}?text=${whatsappText}" 
               target="_blank" 
               class="bg-[#25D366] text-white px-5 py-2.5 rounded-xl font-bold text-xs hover:opacity-95 flex items-center justify-center gap-2 shadow-sm transition">
              <i class="fa-brands fa-whatsapp text-base"></i> ${isPreorder ? 'Encargar (Opción 1)' : 'Comprar (Opción 1)'}
            </a>
            <a href="https://wa.me/${SECONDARY_WA}?text=${whatsappText}" 
               target="_blank" 
               class="bg-[#128C7E] text-white px-5 py-2.5 rounded-xl font-bold text-xs hover:opacity-95 flex items-center justify-center gap-2 shadow-sm transition">
              <i class="fa-brands fa-whatsapp text-base"></i> ${isPreorder ? 'Encargar (Opción 2)' : 'Comprar (Opción 2)'}
            </a>
          </div>
        </div>
      `;
      modal.classList.remove("hidden");
    }

    function closeModal() {
      modal.classList.add("hidden");
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.classList.remove("bg-gray-900", "text-white");
        btn.classList.add("bg-gray-100", "text-gray-600");
      });
      event.target.classList.remove("bg-gray-100", "text-gray-600");
      event.target.classList.add("bg-gray-900", "text-white");
      applyFilters();
    }

    function applyFilters() {
      const q = searchInput.value.toLowerCase().trim();
      const filtered = perfumes.filter(p => {
        const matchesCategory = currentCategory === "todos" || p.gender === currentCategory;
        const matchesSearch = p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q);
        return matchesCategory && matchesSearch;
      });

      filtered.sort((a, b) => {
        const aPreorder = a.price === "$0" || a.price === "$0.00";
        const bPreorder = b.price === "$0" || b.price === "$0.00";
        return aPreorder - bPreorder;
      });

      renderCards(filtered);
    }

    searchInput.addEventListener("input", applyFilters);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });
  </script>
</body>
</html>
