  <script>
    // ==========================================
    // LÓGICA MODO OSCURO
    // ==========================================
    const btnDarkMode = document.getElementById('btnDarkMode');
    const htmlElement = document.documentElement;

    btnDarkMode.addEventListener('click', () => {
      htmlElement.classList.toggle('dark');
      if (htmlElement.classList.contains('dark')) {
        localStorage.setItem('temaANLU', 'oscuro');
      } else {
        localStorage.setItem('temaANLU', 'claro');
      }
    });
    // ==========================================

    const SHEET_ID = "1kCqVj7HIP7oouLyOmwptYOmbXEuzQARgxvmit7EdsXw";
    const GID = "1819198756";

    const PRIMARY_WA = "584243306803";
    const SECONDARY_WA = "584124596671";
    
    let perfumes = [];
    let currentCategory = "todos";

    const grid = document.getElementById("perfumesGrid");
    const noResults = document.getElementById("noResults");
    const modal = document.getElementById("perfumeModal");
    const modalContent = document.getElementById("modalContent");
    const searchInput = document.getElementById("searchInput");
    const loading = document.getElementById("loading");

    function toggleWaPopup() {
      const popup = document.getElementById("waPopup");
      popup.classList.toggle("hidden");
    }

    function getAccordColor(name) {
      if (!name) return "#5D6D7E";
      const n = name.toLowerCase();
      if(n.includes("cítrico") || n.includes("limón")) return "#F1C40F";
      if(n.includes("amaderado") || n.includes("madera") || n.includes("cuero")) return "#795548";
      if(n.includes("dulce") || n.includes("avainillado") || n.includes("gourmand") || n.includes("caramelo")) return "#D35400";
      if(n.includes("acuático") || n.includes("fresco")) return "#3498DB";
      if(n.includes("frutado") || n.includes("tropical") || n.includes("frutal")) return "#E67E22";
      if(n.includes("floral") || n.includes("blanco") || n.includes("rosa")) return "#E91E63";
      if(n.includes("especiado") || n.includes("ambarado") || n.includes("ámbar")) return "#A04000";
      if(n.includes("verde") || n.includes("aromático") || n.includes("musgo")) return "#2ECC71";
      if(n.includes("almizclado") || n.includes("atalcado") || n.includes("lactónico")) return "#BDC3C7";
      return "#5D6D7E"; 
    }

    function cargarDatos(esSilencioso = false) {
      const urlConAntiCache = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}&t=${Date.now()}`;

      Papa.parse(urlConAntiCache, {
        download: true,
        header: false,
        complete: function(results) {
          const rawData = results.data;
          let nuevosPerfumes = [];
          
          rawData.forEach((row, index) => {
            if (!row || row.length < 5 || !row[1] || row[1].trim().toLowerCase() === "nombre") return;

            let nombre = row[1] ? row[1].trim() : "";
            let marca = row[2] ? row[2].trim() : "";
            let genero = row[3] ? row[3].trim().toLowerCase() : "unisex";
            let precioCrudo = row[4] ? row[4].toString() : "";
            let stockCrudo = row[5] ? row[5].toString() : "1";
            let imagen = row[6] ? row[6].trim() : "";
            let concentracion = row[7] ? row[7].trim() : "";
            
            if (nombre === "") return;

            let cleanPrice = precioCrudo.replace(/[^0-9.,]/g, "").replace(",", ".");
            let priceVal = parseFloat(cleanPrice);

            let stockVal = parseInt(stockCrudo, 10);
            if (isNaN(stockVal)) stockVal = 1;

            let isOutOfStock = stockVal <= 0;
            let priceStr = (isNaN(priceVal) || priceVal === 0 || isOutOfStock) ? "$0" : "$" + priceVal.toFixed(2);

            let accords = [];
            const widths = ["100%", "85%", "70%", "55%", "40%"];
            for(let i=0; i<5; i++) {
              let aName = row[8 + i];
              if(aName && aName.trim() !== "") {
                accords.push({ name: aName.trim(), width: widths[i], color: getAccordColor(aName) });
              }
            }

            let topNotes = row[13] ? row[13].split(',').map(s=>s.trim()) : [];
            let heartNotes = row[14] ? row[14].split(',').map(s=>s.trim()) : [];
            let baseNotes = row[15] ? row[15].split(',').map(s=>s.trim()) : [];

            nuevosPerfumes.push({
              id: index + 1,
              name: nombre,
              brand: marca,
              gender: genero,
              price: priceStr,
              image: imagen,
              concentration: concentracion,
              accords: accords,
              topNotes: topNotes,
              heartNotes: heartNotes,
              baseNotes: baseNotes
            });
          });

          if (JSON.stringify(nuevosPerfumes) !== JSON.stringify(perfumes)) {
            perfumes = nuevosPerfumes;
            applyFilters();
          }
          
          if (!esSilencioso) {
            loading.classList.add("hidden");
            grid.classList.remove("hidden");
          }
        },
        error: function(err) {
          if (!esSilencioso) {
            loading.innerHTML = '<p class="text-red-500 font-bold mt-4">Error al conectar con la base de datos de Google Sheets.</p>';
          }
        }
      });
    }

    cargarDatos();

    setInterval(() => {
      cargarDatos(true);
    }, 20000);

    function renderCards(data) {
      if (data.length === 0) {
        grid.innerHTML = "";
        noResults.classList.remove("hidden");
        return;
      }
      noResults.classList.add("hidden");

      grid.innerHTML = data.map(p => {
        const isPreorder = p.price === "$0" || p.price === "$0.00";
        const displayPrice = isPreorder ? "ENCARGAR" : p.price;
        const priceClass = isPreorder ? "text-blue-600 dark:text-blue-400 text-sm tracking-widest" : "text-gray-900 dark:text-white text-lg";

        const badgeHTML = isPreorder 
          ? '<span class="absolute top-3 right-3 bg-blue-100 dark:bg-blue-900/60 text-blue-700 dark:text-blue-300 text-[10px] font-black px-2 py-1 rounded-md uppercase tracking-wide shadow-sm">Bajo Pedido</span>'
          : '<span class="absolute top-3 right-3 bg-green-100 dark:bg-green-900/60 text-green-700 dark:text-green-300 text-[10px] font-black px-2 py-1 rounded-md uppercase tracking-wide shadow-sm">Disponible</span>';

        return `
        <div onclick="openModal(${p.id})" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm hover:shadow-xl transition duration-200 cursor-pointer overflow-hidden border border-gray-200 dark:border-gray-700 flex flex-col justify-between group">
          <div class="h-64 flex items-center justify-center p-4 bg-gray-50/70 dark:bg-gray-700/50 group-hover:bg-white dark:group-hover:bg-gray-700 transition relative">
            ${badgeHTML}
            <img src="${p.image}" alt="${p.name}" class="h-full object-contain group-hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/300x400?text=ANLU'">
          </div>
          <div class="p-4 flex flex-col justify-between flex-1">
            <div>
              <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider">${p.brand}</span>
                <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded-full ${
                  p.gender === 'hombre' ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-800' :
                  p.gender === 'mujer' ? 'bg-pink-50 dark:bg-pink-900/30 text-pink-600 dark:text-pink-400 border border-pink-200 dark:border-pink-800' :
                  p.gender === 'splash' ? 'bg-teal-50 dark:bg-teal-900/30 text-teal-600 dark:text-teal-400 border border-teal-200 dark:border-teal-800' :
                  'bg-purple-50 dark:bg-purple-900/30 text-purple-600 dark:text-purple-400 border border-purple-200 dark:border-purple-800'
                }">${p.gender}</span>
              </div>
              <h3 class="font-bold text-gray-900 dark:text-white text-base mt-1 leading-snug">${p.name}</h3>
            </div>
            <div class="mt-4 flex justify-between items-center pt-3 border-t border-gray-100 dark:border-gray-700">
              <span class="font-black ${priceClass}">${displayPrice}</span>
              <button class="text-xs bg-gray-900 dark:bg-white text-white dark:text-gray-900 px-3 py-1.5 rounded-md font-medium hover:bg-black dark:hover:bg-gray-200 transition">Ver Notas</button>
            </div>
          </div>
        </div>
      `}).join("");
    }

    function openModal(id) {
      const p = perfumes.find(item => item.id === id);
      if (!p) return;

      const isPreorder = p.price === "$0" || p.price === "$0.00";
      const displayPrice = isPreorder ? "ENCARGAR" : p.price;
      const priceLabel = isPreorder ? "Disponibilidad" : "Precio";
      
      const badgeHTML = isPreorder 
        ? '<span class="absolute top-2 left-2 bg-blue-100 dark:bg-blue-900/60 text-blue-700 dark:text-blue-300 text-[10px] font-black px-2 py-1 rounded-md uppercase tracking-wide shadow-sm">Bajo Pedido</span>'
        : '<span class="absolute top-2 left-2 bg-green-100 dark:bg-green-900/60 text-green-700 dark:text-green-300 text-[10px] font-black px-2 py-1 rounded-md uppercase tracking-wide shadow-sm">Disponible</span>';

      const whatsappText = isPreorder 
        ? encodeURIComponent(`Hola ANLU Perfumes, me interesa encargar el perfume bajo pedido: *${p.name}* (${p.brand})`)
        : encodeURIComponent(`Hola ANLU Perfumes, me interesa comprar el perfume: *${p.name}* (${p.brand}) - ${p.price}`);

      modalContent.innerHTML = `
        <div class="flex flex-col md:flex-row gap-6 items-center md:items-start mb-6">
          <div class="w-48 h-48 flex items-center justify-center bg-gray-50 dark:bg-gray-700/50 rounded-xl border border-gray-200 dark:border-gray-600 p-2 flex-shrink-0 relative">
            ${badgeHTML}
            <img src="${p.image}" class="max-h-full max-w-full object-contain" onerror="this.src='https://via.placeholder.com/300x400?text=ANLU'">
          </div>
          <div class="flex-1 w-full">
            <span class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest">${p.brand}</span>
            <h2 class="text-2xl font-black text-gray-900 dark:text-white leading-tight">${p.name}</h2>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1 mb-4">${p.concentration} • <span class="capitalize font-semibold">${p.gender}</span></p>
            
            <h4 class="text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-2">Acordes Principales</h4>
            ${p.accords.map(a => `
              <div class="accord-bar" style="width: ${a.width}; background-color: ${a.color};">${a.name}</div>
            `).join("")}
          </div>
        </div>

        <div class="border-t border-gray-100 dark:border-gray-700 pt-5">
          <h4 class="text-center font-bold text-gray-800 dark:text-gray-200 text-xs uppercase tracking-widest mb-4">Pirámide Olfativa</h4>
          
          <div class="space-y-3">
            <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-lg border-l-4 border-blue-500">
              <span class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase">Notas de Salida:</span>
              <p class="text-sm font-medium text-gray-800 dark:text-gray-200 mt-0.5">${p.topNotes.join(" • ")}</p>
            </div>
            <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-lg border-l-4 border-pink-500">
              <span class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase">Notas de Corazón:</span>
              <p class="text-sm font-medium text-gray-800 dark:text-gray-200 mt-0.5">${p.heartNotes.join(" • ")}</p>
            </div>
            <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-lg border-l-4 border-amber-600">
              <span class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase">Notas de Fondo:</span>
              <p class="text-sm font-medium text-gray-800 dark:text-gray-200 mt-0.5">${p.baseNotes.join(" • ")}</p>
            </div>
          </div>
        </div>

        <div class="mt-6 flex flex-col sm:flex-row justify-between items-center gap-4 ${isPreorder ? 'bg-blue-50 dark:bg-blue-900/20 border-blue-200 dark:border-blue-800' : 'bg-gray-50 dark:bg-gray-700 border-gray-200 dark:border-gray-600'} p-4 rounded-xl border">
          <div>
            <span class="text-xs ${isPreorder ? 'text-blue-600 dark:text-blue-400' : 'text-gray-500 dark:text-gray-400'} uppercase font-semibold">${priceLabel}</span>
            <div class="text-2xl font-black ${isPreorder ? 'text-blue-700 dark:text-blue-300' : 'text-gray-900 dark:text-white'}">${displayPrice}</div>
          </div>
          
          <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
            <a href="https://wa.me/${PRIMARY_WA}?text=${whatsappText}" 
               target="_blank" 
               class="bg-[#25D366] text-white px-5 py-2.5 rounded-xl font-bold text-xs hover:opacity-95 flex items-center justify-center gap-2 shadow-sm transition">
              <i class="fa-brands fa-whatsapp text-base"></i> ${isPreorder ? 'Encargar (Opción 1)' : 'Comprar (Opción 1)'}
            </a>
            <a href="https://wa.me/${SECONDARY_WA}?text=${whatsappText}" 
               target="_blank" 
               class="bg-[#128C7E] text-white px-5 py-2.5 rounded-xl font-bold text-xs hover:opacity-95 flex items-center justify-center gap-2 shadow-sm transition">
              <i class="fa-brands fa-whatsapp text-base"></i> ${isPreorder ? 'Encargar (Opción 2)' : 'Comprar (Opción 2)'}
            </a>
          </div>
        </div>
      `;
      modal.classList.remove("hidden");
    }

    function closeModal() {
      modal.classList.add("hidden");
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.classList.remove("bg-gray-900", "text-white", "dark:bg-white", "dark:text-gray-900");
        btn.classList.add("bg-gray-100", "text-gray-600", "dark:bg-gray-700", "dark:text-gray-300");
      });
      event.target.classList.remove("bg-gray-100", "text-gray-600", "dark:bg-gray-700", "dark:text-gray-300");
      event.target.classList.add("bg-gray-900", "text-white", "dark:bg-white", "dark:text-gray-900");
      applyFilters();
    }

    function applyFilters() {
      const q = searchInput.value.toLowerCase().trim();
      const filtered = perfumes.filter(p => {
        const matchesCategory = currentCategory === "todos" || p.gender === currentCategory;
        const matchesSearch = p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q);
        return matchesCategory && matchesSearch;
      });

      filtered.sort((a, b) => {
        const aPreorder = a.price === "$0" || a.price === "$0.00";
        const bPreorder = b.price === "$0" || b.price === "$0.00";
        return aPreorder - bPreorder;
      });

      renderCards(filtered);
    }

    searchInput.addEventListener("input", applyFilters);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });
  </script>
</body>
</html>
