<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANLU Parfums | Catálogo Oficial</title>
    <meta name="description" content="Descubre el catálogo oficial de ANLU Parfums. Fragancias exclusivas, perfumería de diseñador y árabes al mejor precio en Venezuela.">
    
    <link rel="icon" type="image/png" href="favicon.png">

    <meta property="og:title" content="ANLU Parfums | Catálogo Oficial">
    <meta property="og:description" content="Explora nuestro inventario en tiempo real y encuentra tu fragancia ideal.">
    <meta property="og:image" content="https://anlu-parfums.vercel.app/trans.png">
    <meta property="og:url" content="https://anlu-parfums.vercel.app">
    <meta property="og:type" content="website">

    <script>
      if (localStorage.getItem('temaANLU') === 'oscuro' || (!('temaANLU' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class', }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CLIENTE OFICIAL DE SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
      .accord-bar { height: 22px; border-radius: 4px; display: flex; align-items: center; padding-left: 10px; font-size: 0.75rem; font-weight: 700; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); margin-bottom: 6px; transition: transform 0.15s ease; }
      .accord-bar:hover { transform: scaleX(1.02); }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-sans min-h-screen pb-16 transition-colors duration-300">

  <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-30 transition-colors duration-300">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center justify-between w-full md:w-auto">
        <img src="1234.png" alt="ANLU Parfums Logo" class="h-14 md:h-36 object-contain">
      </div>
      <div class="flex w-full md:w-auto items-center gap-2">
        <div class="w-full md:w-80 relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 dark:text-gray-500 text-sm"></i>
          <input type="text" id="searchInput" placeholder="Buscar por nombre o marca..." class="w-full pl-9 pr-4 py-2 border dark:border-gray-600 rounded-full text-sm bg-gray-50 dark:bg-gray-700 dark:text-white focus:bg-white dark:focus:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-900 dark:focus:ring-gray-300 transition">
        </div>
        <button id="btnDarkMode" class="relative w-10 h-10 flex-shrink-0 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 flex items-center justify-center hover:bg-gray-200 dark:hover:bg-gray-600 transition" title="Cambiar tema">
          <i class="fa-solid fa-moon block dark:hidden"></i>
          <i class="fa-solid fa-sun hidden dark:block"></i>
        </button>
        <button onclick="toggleCart()" class="relative w-10 h-10 flex-shrink-0 rounded-full bg-gray-900 dark:bg-white text-white dark:text-gray-900 flex items-center justify-center hover:scale-105 transition shadow-sm" title="Ver Carrito">
          <i class="fa-solid fa-cart-shopping"></i>
          <span id="cartBadge" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full hidden transition-all border border-white dark:border-gray-800">0</span>
        </button>
      </div>
    </div>
    <div class="border-t border-gray-100 dark:border-gray-700 bg-white dark:bg-gray-800 transition-colors duration-300">
      <div class="max-w-6xl mx-auto px-4 flex gap-2 overflow-x-auto py-2.5 scrollbar-none">
        <button onclick="filterCategory(this, 'todos')" class="filter-btn active px-4 py-1.5 rounded-full text-sm font-semibold transition bg-gray-900 dark:bg-white text-white dark:text-gray-900">Todos</button>
        <button onclick="filterCategory(this, 'hombre')" class="filter-btn px-4 py-1.5 rounded-full text-sm font-semibold transition bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">Hombre</button>
        <button onclick="filterCategory(this, 'mujer')" class="filter-btn px-4 py-1.5 rounded-full text-sm font-semibold transition bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">Mujer</button>
        <button onclick="filterCategory(this, 'unisex')" class="filter-btn px-4 py-1.5 rounded-full text-sm font-semibold transition bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">Unisex</button>
        <button onclick="filterCategory(this, 'splash')" class="filter-btn px-4 py-1.5 rounded-full text-sm font-semibold transition bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">Splash</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 relative">
    <div id="loading" class="text-center py-16">
      <i class="fa-solid fa-spinner fa-spin text-4xl text-gray-400 dark:text-gray-500 mb-4"></i>
      <p class="text-gray-500 dark:text-gray-400 font-medium text-lg">Cargando inventario desde Supabase...</p>
    </div>
    <div id="perfumesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden"></div>
    <div id="noResults" class="hidden text-center py-16">
      <p class="text-gray-500 dark:text-gray-400 font-medium text-lg">No encontramos perfumes que coincidan con tu búsqueda.</p>
    </div>
  </main>

  <!-- SIDEBAR DEL CARRITO CON CHECKBOXES LEGALES -->
  <div id="cartOverlay" onclick="toggleCart()" class="fixed inset-0 bg-black/50 z-40 hidden backdrop-blur-sm transition-opacity"></div>
  <div id="cartSidebar" class="fixed inset-y-0 right-0 w-full max-w-sm bg-white dark:bg-gray-800 shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
    <div class="flex items-center justify-between p-5 border-b border-gray-100 dark:border-gray-700">
      <h2 class="text-lg font-black dark:text-white uppercase tracking-wider"><i class="fa-solid fa-cart-shopping mr-2"></i>Tu Pedido</h2>
      <button onclick="toggleCart()" class="text-gray-400 hover:text-gray-900 dark:hover:text-white text-2xl"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="cartItems" class="flex-1 overflow-y-auto p-5 space-y-5"></div>
    <div class="p-5 border-t border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-900">
       <div class="flex justify-between items-center mb-4">
         <span class="font-bold text-gray-500 dark:text-gray-400 uppercase text-sm">Total Estimado:</span>
         <span id="cartTotal" class="font-black text-2xl text-gray-900 dark:text-white">$0.00</span>
       </div>

       <!-- CASILLAS LEGALES REQUERIDAS -->
       <div class="mb-4 space-y-2 text-xs text-gray-600 dark:text-gray-300 border-t border-gray-200 dark:border-gray-700 pt-3">
         <label class="flex items-start gap-2 cursor-pointer">
           <input type="checkbox" id="terminosCheck" class="mt-0.5 rounded text-gray-900 focus:ring-0">
           <span>Acepto los <a href="#" onclick="openLegalModal('terminos'); return false;" class="text-blue-500 underline font-medium">Términos y Condiciones</a> y la <a href="#" onclick="openLegalModal('privacidad'); return false;" class="text-blue-500 underline font-medium">Política de Privacidad</a>.</span>
         </label>
         <label class="flex items-start gap-2 cursor-pointer">
           <input type="checkbox" id="cookiesCheck" class="mt-0.5 rounded text-gray-900 focus:ring-0">
           <span>Acepto la <a href="#" onclick="openLegalModal('cookies'); return false;" class="text-blue-500 underline font-medium">Política de Cookies</a> y almacenamiento local.</span>
         </label>
       </div>

       <button onclick="checkoutWhatsApp()" class="w-full bg-[#25D366] text-white py-3.5 rounded-xl font-bold text-sm hover:opacity-95 flex items-center justify-center gap-2 shadow-lg hover:shadow-xl transition transform hover:-translate-y-0.5">
         <i class="fa-brands fa-whatsapp text-lg"></i> Enviar Pedido
       </button>
       <p class="text-[10px] text-center text-gray-400 mt-3">El pago y la entrega se coordinan por WhatsApp.</p>
    </div>
  </div>

  <!-- MODAL DE DOCUMENTOS LEGALES -->
  <div id="legalModal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white dark:bg-gray-800 w-full max-w-lg rounded-2xl p-6 relative max-h-[85vh] overflow-y-auto border border-gray-700 shadow-2xl">
      <button onclick="closeLegalModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl font-bold">&times;</button>
      <div id="legalModalBody" class="text-sm space-y-3 text-gray-700 dark:text-gray-300"></div>
    </div>
  </div>

  <!-- Botones Flotantes (Derecha) -->
  <div class="fixed bottom-5 right-5 z-40 flex flex-col items-center gap-3">
    <a href="https://instagram.com/anluu.lg" target="_blank" class="w-14 h-14 rounded-full bg-gradient-to-tr from-yellow-500 via-pink-500 to-purple-600 text-white shadow-lg hover:shadow-xl hover:scale-105 transition-all flex items-center justify-center text-2xl group relative" title="Síguenos en Instagram">
      <i class="fa-brands fa-instagram"></i>
    </a>
    <div class="relative flex flex-col items-center">
      <div id="waPopup" class="hidden absolute bottom-16 right-0 bg-white dark:bg-gray-800 shadow-2xl rounded-2xl p-4 border border-gray-100 dark:border-gray-700 w-64 animate-fade-in transition-all z-50">
        <p class="text-xs font-black uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-2">Consultas Rápidas</p>
        <div class="space-y-2">
          <a href="https://wa.me/584243306803?text=Hola%20ANLU%20Perfumes%2C%20tengo%20una%20duda%20sobre%20el%20catálogo" target="_blank" class="flex items-center gap-3 p-2 rounded-xl hover:bg-green-50 dark:hover:bg-gray-700 transition">
            <div class="w-8 h-8 rounded-full bg-[#25D366] text-white flex items
